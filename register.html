<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="assets/transitions.css?v=1">
<script>if(/[?&]motion=1/.test(location.search))document.documentElement.classList.add("motion-forced");</script>
<title>注册 · 考研科目大观</title>
<meta name="description" content="用手机号注册考研科目大观，保存刷题记录与复习进度。">
<link rel="stylesheet" href="assets/auth.css?v=20261115">
</head>
<body class="register-page">
<div class="auth-wrap">

  <header class="auth-header">
    <a class="abrand" href="index.html">
      <span class="amark">观</span>
      <span><b>考研科目大观</b><small>KAOYAN ATLAS · 2027</small></span>
    </a>

    <a class="header-link" href="login.html">已有账号，登录 <span aria-hidden="true">↗</span></a>
  </header>

  <main class="auth-main">
    <div class="auth-intro">
      <h1>让每一次积累，都有迹可循。</h1>
      <p>创建你的大观账号，开启这一程复习。</p>
    </div>
    <div class="acard">
      <div class="ahead">
        <h2>注册账号</h2>
        <p>已有账号？<a href="login.html">直接登录</a></p>
      </div>

      <div class="alert" id="alert" role="status" aria-live="polite" aria-atomic="true"></div>

      <form id="registerForm" novalidate>
        <div class="field">
          <label for="phone">手机号</label>
          <input id="phone" name="phone" type="tel" inputmode="numeric" maxlength="11"
                 autocomplete="tel" placeholder="11 位手机号，用于接收验证码" required>
        </div>

        <div class="field">
          <label for="code">短信验证码</label>
          <div class="ctrl">
            <input id="code" class="code" name="code" type="text" inputmode="numeric" maxlength="6"
                   autocomplete="one-time-code" placeholder="6 位数字">
            <button class="send" id="sendBtn" type="button">获取验证码</button>
          </div>
          <div class="hint" id="codeHint">验证码 5 分钟内有效，60 秒后可重新获取</div>
        </div>

        <div class="field">
          <label for="nickname">昵称</label>
          <input id="nickname" name="nickname" type="text" maxlength="16"
                 autocomplete="nickname" placeholder="2–16 个字符，可中文">
        </div>

        <div class="field">
          <label for="password">设置密码</label>
          <input id="password" name="password" type="password" maxlength="32"
                 autocomplete="new-password" placeholder="8–32 位，需含字母和数字">
          <div class="hint" id="pwHint">建议字母 + 数字 + 符号混合</div>
        </div>

        <div class="field">
          <label for="password2">确认密码</label>
          <input id="password2" name="password2" type="password" maxlength="32"
                 autocomplete="new-password" placeholder="再输入一次">
        </div>

        <label class="check" style="margin:2px 0 18px">
          <input type="checkbox" id="agree">
          <span>我已阅读并同意《用户说明》，了解本站仅用于个人复习存档，不对外提供真题版权内容。</span>
        </label>

        <button class="btn-main ver" id="submitBtn" type="submit">注册并登录</button>

        <div class="form-foot">
          <b>关于短信</b> · 验证码由阿里云短信服务发送，仅用于本次注册的手机号校验；
          我们不会向你发送营销短信，也不会把号码提供给第三方。
        </div>
      </form>
    </div>
  </main>
  <footer class="auth-footer">
    <p>数学一 / 英语一 / 807 材料力学 / 政治</p>
    <p>距离 2027 考研初试 <b id="examDays">—</b> 天</p>
  </footer>
</div>

<script src="assets/config.js?v=2027-11-12"></script>
<script src="assets/auth.js?v=4"></script>
<script>
(function () {
  'use strict';
  var A = window.AtlasAuth;

  document.getElementById('examDays').textContent = A.examDays();

  var alertEl = document.getElementById('alert');
  var form = document.getElementById('registerForm');
  var phone = document.getElementById('phone');
  var code = document.getElementById('code');
  var nickname = document.getElementById('nickname');
  var password = document.getElementById('password');
  var password2 = document.getElementById('password2');
  var agree = document.getElementById('agree');
  var submitBtn = document.getElementById('submitBtn');
  var codeHint = document.getElementById('codeHint');
  var pwHint = document.getElementById('pwHint');
  var sendBtn = document.getElementById('sendBtn');

  /* 输入过滤 */
  phone.addEventListener('input', function () {
    phone.value = phone.value.replace(/\D/g, '').slice(0, 11);
  });
  code.addEventListener('input', function () {
    code.value = code.value.replace(/\D/g, '').slice(0, 6);
  });

  /* 密码强度提示 */
  password.addEventListener('input', function () {
    var v = password.value;
    var ok = v.length >= 8 && v.length <= 32 && /[A-Za-z]/.test(v) && /\d/.test(v);
    pwHint.textContent = ok
      ? '强度可用' + (/[^A-Za-z0-9]/.test(v) ? '（含符号，更安全）' : '，加个符号会更安全')
      : '至少 8 位，且同时包含字母和数字';
    pwHint.classList.toggle('err', v.length > 0 && !ok);
    pwHint.style.color = v.length > 0 && ok ? 'var(--green)' : '';
  });

  /* 获取验证码 */
  A.bindSendCode({
    btn: sendBtn,
    phone: phone,
    scene: 'register',
    onSent: function (r) {
      if (r.error) {
        A.alertBox(alertEl, r.error);
        codeHint.classList.add('err');
        codeHint.textContent = r.error;
        return;
      }
      A.alertBox(alertEl, '验证码已发送，请查看手机短信', 'ok');
      codeHint.classList.remove('err');
      codeHint.textContent = '已发送至 ' + phone.value.replace(/^(\d{3})\d{4}(\d{4})$/, '$1****$2');
      if (r.data && r.data.devCode) {
        code.value = r.data.devCode;
        codeHint.textContent += '（本地演示模式，已自动填入）';
      }
      code.focus();
    }
  });

  /* 提交注册 */
  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    if (submitBtn.disabled) return;
    A.alertBox(alertEl, '');

    var p = phone.value.trim();
    if (!/^1[3-9]\d{9}$/.test(p)) {
      A.shake(phone);
      phone.focus();
      return A.alertBox(alertEl, '请输入正确的 11 位手机号');
    }
    if (!/^\d{6}$/.test(code.value)) {
      A.shake(code);
      code.focus();
      return A.alertBox(alertEl, '请输入 6 位数字验证码');
    }
    var nick = nickname.value.trim();
    if (nick.length < 2 || nick.length > 16) {
      A.shake(nickname);
      nickname.focus();
      return A.alertBox(alertEl, '昵称长度需为 2–16 个字符');
    }
    if (!(password.value.length >= 8 && password.value.length <= 32)) {
      A.shake(password);
      password.focus();
      return A.alertBox(alertEl, '密码长度需为 8–32 位');
    }
    if (!/[A-Za-z]/.test(password.value) || !/\d/.test(password.value)) {
      A.shake(password);
      password.focus();
      return A.alertBox(alertEl, '密码需同时包含字母和数字');
    }
    if (password.value !== password2.value) {
      A.shake(password2);
      password2.focus();
      return A.alertBox(alertEl, '两次输入的密码不一致');
    }
    if (!agree.checked) {
      return A.alertBox(alertEl, '请先勾选同意《用户说明》');
    }

    submitBtn.disabled = true;
    form.setAttribute('aria-busy', 'true');
    submitBtn.textContent = '注册中…';
    try {
      await A.post('/api/auth/register', {
        phone: p,
        code: code.value,
        nickname: nick,
        password: password.value,
      });
      A.alertBox(alertEl, '注册成功，正在进入图谱…', 'ok');
      setTimeout(function () {
        location.href = 'index.html';
      }, 600);
    } catch (err) {
      A.alertBox(alertEl, err.message);
      if (err.status === 400 && /验证码/.test(err.message)) {
        A.shake(code);
        code.focus();
      }
      if (err.status === 409) A.shake(phone);
      submitBtn.disabled = false;
      form.setAttribute('aria-busy', 'false');
      submitBtn.textContent = '注册并登录';
    }
  });
})();
</script>
</body>
</html>
