<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#17161A"><link rel="stylesheet" href="assets/transitions.css?v=2"><script>if(/[?&]motion=0/.test(location.search))document.documentElement.classList.add("motion-off");</script><title>我的资料 · 考研科目大观</title><link rel="stylesheet" href="assets/theme.css?v=1"><link rel="stylesheet" href="assets/library.css"><link rel="stylesheet" href="assets/site-tools.css?v=4">  <link rel="stylesheet" href="assets/account-hub.css?v=1">
</head><body>
<header class="top"><a class="back" href="index.html">← 返回图谱</a><a class="brand" href="index.html"><span class="mark">观</span><span><b>我的资料</b><small>MY LIBRARY · 2027</small></span></a><span class="spacer"></span><a class="btn ghost" href="practice.html">去刷题</a></header>
<main><div class="eyebrow">PERSONAL LIBRARY</div><h1>我的资料</h1><p class="intro">上传资料，按页提取题目；审阅并确认后加入个人题库。</p>
<section><h2>上传资料</h2><p>支持 PDF、PNG、JPEG、WebP、TXT、Markdown、JSON；单个文件不超过 20 MiB。PDF 在浏览器提取文字，扫描页以图片送去识别。</p><form id="upload"><label>资料文件<input required type="file" name="file" accept=".pdf,.png,.jpg,.jpeg,.webp,.txt,.md,.markdown,.json,application/pdf,image/png,image/jpeg,image/webp,text/plain,application/json"></label><label>名称（选填）<input name="name" maxlength="200" placeholder="默认使用文件名"></label><label>分类（自定义）<input name="category" maxlength="30" list="categoryList" placeholder="如：真题 / 讲义 / 笔记 / 模拟卷"><datalist id="categoryList"></datalist></label><label>科目<select name="subject"><option value="math">数学一</option><option value="math2">数学二</option><option value="english">英语一</option><option value="english2">英语二</option><option value="mechanics">材料力学</option><option value="politics">政治</option><option value="__new">＋ 新建我的科目…</option></select></label><label id="newSubjectRow" hidden>新科目名称<input name="newSubject" maxlength="30" placeholder="例如：408 计算机学科专业基础"></label><button>上传</button></form></section>
<p id="status" role="status" aria-live="polite"></p><section><h2>已上传资料</h2><label>按分类看 <select id="fileFilter"><option value="">全部分类</option></select></label><div id="files">正在加载…</div></section>
<section id="extract" hidden><h2>按页抽题</h2><p id="selected"></p><label>页码范围 <input id="pages" value="1" placeholder="例如 1-3,5"></label><p>按 PDF 页码选择；图片和文本为第 1 页。逐页处理，进度会显示在下方。</p><button id="start">开始抽题</button><div id="progress" role="status" aria-live="polite"></div></section>
<section id="review" hidden><h2>审阅题目草稿</h2><p>请核对题目、答案、来源页及待核状态。编辑题目、答案和解析后，勾选需要导入的题目。</p><div id="drafts"></div><button id="import">确认导入所选题目</button></section>
<section><h2>个人题库</h2><div id="questions">正在加载…</div></section></main>
<script src="assets/user-state.js"></script><script src="assets/grading-bg.js?v=1"></script><script src="assets/ai-config.js?v=1"></script><script src="assets/site-tools.js?v=4"></script><script type="module" src="assets/library.js?v=3"></script><script src="assets/pwa.js?v=1"></script><script src="assets/account-hub.js?v=1"></script>
</body></html>
