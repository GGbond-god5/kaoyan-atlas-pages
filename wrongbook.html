<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#17161A">
<link rel="stylesheet" href="assets/transitions.css?v=2">
<script>if(/[?&]motion=0/.test(location.search))document.documentElement.classList.add("motion-off");</script>
<title>错题本 · 考研科目大观</title>
<link rel="stylesheet" href="assets/theme.css?v=1">
<link rel="stylesheet" href="assets/panel.css?v=1">
<link rel="stylesheet" href="assets/katex/katex.min.css">
<link rel="stylesheet" href="assets/wrongbook.css?v=2">
<link rel="stylesheet" href="assets/account-hub.css?v=3">
</head>
<body>
<header class="top">
  <a class="brand" href="index.html" style="text-decoration:none;color:inherit">
    <span class="mark">观</span>
    <span><b>考研科目大观</b><small>错题本</small></span>
  </a>
  <nav>
    <a class="btn ghost" href="practice.html">返回刷题</a>
    <a class="btn ghost" href="index.html">返回首页</a>
  </nav>
</header>

<main class="panel">
  <section class="card wb-card">
    <h2>我的错题本</h2>
    <p class="note">汇总你做错过的所有题（按错次排序），按科目分选项卡查看，每科只看本的题。不想再复盘的题可点条目下的「移出错题本」；收藏夹里的题可「取消收藏」。打印或另存为 PDF 时有两种版式：只题目（先做一遍再对答案）和带答案解析（直接复盘）。在 App 里点打印没反应时，用「下载文件」把当前科目的册子存下来。</p>
    <div class="wb-tabs" id="wbSubjectTabs" role="tablist" aria-label="按科目查看"></div>
    <div class="wb-toolbar">
      <label>范围
        <select id="wbScope">
          <option value="all">全部错题</option>
          <option value="due">仅今日到期复习</option>
          <option value="fav">收藏夹</option>
        </select>
      </label>
      <label>版式
        <select id="wbMode">
          <option value="answers">带答案解析</option>
          <option value="blank">只题目（自测）</option>
        </select>
      </label>
      <a class="btn ghost" href="practice.html?review=1">去复盘（今日到期）</a>
      <a class="btn ghost" href="practice.html?wrongbook=1">刷错题本</a>
      <button class="btn" id="wbPrint" type="button">打印 / 存 PDF</button>
      <button class="btn ghost" id="wbDownload" type="button">下载文件（App 用）</button>
    </div>
    <p class="note" id="wbSummary">正在加载错题…</p>
    <div id="wbList"></div>
  </section>
</main>

<script src="assets/katex/katex.min.js"></script>
<script src="assets/katex/contrib/auto-render.min.js"></script>
<script src="assets/questions-loader.js?v=2"></script>
<script src="assets/config.js?v=2027-11-08"></script>
<script src="assets/user-state.js?v=3"></script><script src="assets/grading-bg.js?v=3"></script>
<script src="assets/review.js?v=1"></script>
<script src="assets/marks.js?v=1"></script>
<script src="assets/wrongbook.js?v=5"></script>
<script src="assets/pwa.js?v=1"></script>
<script src="assets/ai-config.js?v=1"></script>
<script src="assets/account-hub.js?v=5"></script>
</body>
</html>
