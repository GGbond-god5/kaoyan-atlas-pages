<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-label="柱坐标与球坐标">
  <style>
    .ink{stroke:#2A2723;fill:none;stroke-width:1.2}.thin{stroke:#2A2723;fill:none;stroke-width:1}
    .acc{stroke:#8A4B2A;fill:none;stroke-width:1.6}.acc2{stroke:#5B3A6B;fill:none;stroke-width:1.5}
    .dash{stroke:#A8342A;fill:none;stroke-width:1;stroke-dasharray:4 3}
    .lbl{font:12px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#2A2723}
    .sub{font:11px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#6B6357}
    .fml{font:12px "Cambria Math","Times New Roman",serif;fill:#8A4B2A}
  </style>
  <text class="lbl" x="20" y="22">柱坐标与球坐标：体积微元不要背错</text>
  <text class="sub" x="20" y="40">先认区域，再选坐标；被积函数含 x²+y² 优先柱/球。</text>

  <!-- cylindrical -->
  <text class="sub" x="40" y="72">柱坐标 (r, θ, z)</text>
  <line class="thin" x1="40" y1="210" x2="150" y2="230"/><text class="sub" x="152" y="234">y</text>
  <line class="thin" x1="40" y1="210" x2="160" y2="210"/><text class="sub" x="162" y="214">x</text>
  <line class="thin" x1="40" y1="210" x2="40" y2="100"/><text class="sub" x="32" y="96">z</text>
  <ellipse cx="100" cy="150" rx="58" ry="20" fill="none" stroke="#B9AE9C"/>
  <line class="acc" x1="40" y1="210" x2="130" y2="160"/>
  <line class="acc" x1="130" y1="160" x2="130" y2="110"/>
  <text class="sub" x="86" y="184">r</text><text class="sub" x="134" y="140">z</text>
  <text class="sub" x="60" y="196">θ</text>
  <text class="fml" x="40" y="258">dV = r dr dθ dz</text>

  <!-- spherical -->
  <text class="sub" x="330" y="72">球坐标 (r, θ, φ)</text>
  <line class="thin" x1="330" y1="210" x2="450" y2="230"/><text class="sub" x="452" y="234">y</text>
  <line class="thin" x1="330" y1="210" x2="450" y2="210"/><text class="sub" x="452" y="214">x</text>
  <line class="thin" x1="330" y1="210" x2="330" y2="100"/><text class="sub" x="322" y="96">z</text>
  <line class="acc" x1="330" y1="210" x2="410" y2="132"/>
  <path class="acc2" d="M410 132 A90 90 0 0 1 360 120"/>
  <path class="acc2" d="M330 210 L400 190"/>
  <text class="sub" x="372" y="176">r</text>
  <text class="sub" x="396" y="118">φ</text>
  <text class="sub" x="360" y="200">θ</text>
  <text class="fml" x="330" y="258">dV = r² sinφ dr dφ dθ</text>
  <text class="sub" x="500" y="120">记忆：柱坐标只在 xy 平面用 r,θ；</text>
  <text class="sub" x="500" y="144">球坐标多一个 φ，体积元多 r²sinφ。</text>
  <text class="sub" x="500" y="168">先画投影 D_xy，再定 z 或 r 的范围。</text>
</svg>
