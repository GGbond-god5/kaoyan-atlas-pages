<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 210" width="560" height="210">
  <rect width="560" height="210" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="20" y="26" font-size="13" font-weight="700" fill="#0f172a">考研英语一大小作文三段式黄金结构与评分四维度</text>
  <rect x="24" y="45" width="160" height="95" rx="8" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="36" y="66" font-size="12" font-weight="700" fill="#1d4ed8">第一段 · 破题/目的</text>
  <text x="36" y="86" font-size="11" fill="#334155">小作文：问候+写信目的</text>
  <text x="36" y="104" font-size="11" fill="#334155">大作文：图画/图表描述</text>
  <text x="36" y="122" font-size="11" fill="#64748b">（2–3 句，约 45 词）</text>
  <rect x="200" y="45" width="160" height="95" rx="8" fill="#ecfdf5" stroke="#10b981"/>
  <text x="212" y="66" font-size="12" font-weight="700" fill="#047857">第二段 · 要点/阐释</text>
  <text x="212" y="86" font-size="11" fill="#334155">小作文：2–3 要点逐条展开</text>
  <text x="212" y="104" font-size="11" fill="#334155">大作文：寓意+双因分析</text>
  <text x="212" y="122" font-size="11" fill="#64748b">（4–6 句，约 85 词）</text>
  <rect x="376" y="45" width="160" height="95" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="388" y="66" font-size="12" font-weight="700" fill="#b45309">第三段 · 展望/收尾</text>
  <text x="388" y="86" font-size="11" fill="#334155">小作文：期待回复+落款</text>
  <text x="388" y="104" font-size="11" fill="#334155">大作文：总结态度+具体建议</text>
  <text x="388" y="122" font-size="11" fill="#64748b">（2 句，约 35 词）</text>
  <rect x="24" y="154" width="512" height="38" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="36" y="177" font-size="11" font-weight="700" fill="#0f172a">阅卷四维度：内容完整(漏点直接降档) · 格式语域得体 · 词汇句式多样 · 语法拼写零硬伤</text>
</svg>