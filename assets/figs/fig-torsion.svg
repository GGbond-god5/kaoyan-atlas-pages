<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" role="img" aria-label="圆轴扭转切应力">
  <style>
    .ink{stroke:#2A2723;fill:none;stroke-width:1.3}.thin{stroke:#2A2723;fill:none;stroke-width:1}
    .acc{stroke:#8A4B2A;fill:none;stroke-width:1.5}.soft{fill:rgba(138,75,42,.08);stroke:#8A4B2A;stroke-width:1.2}
    .dash{stroke:#A8342A;fill:none;stroke-width:1;stroke-dasharray:4 3}
    .lbl{font:12px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#2A2723}
    .sub{font:11px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#6B6357}
    .fml{font:13px "Cambria Math","Times New Roman",serif;fill:#8A4B2A}
  </style>
  <text class="lbl" x="24" y="24">圆轴扭转：切应力沿半径线性分布</text>
  <text class="sub" x="24" y="44">推导三段：几何（γ=ρ dφ/dx）→ 物理（τ=Gγ）→ 静力（T=∫τρ dA）。</text>

  <circle cx="220" cy="160" r="90" class="soft"/>
  <circle cx="220" cy="160" r="3" fill="#2A2723"/>
  <line class="thin" x1="220" y1="70" x2="220" y2="250" stroke-dasharray="4 3"/>
  <line class="thin" x1="130" y1="160" x2="310" y2="160" stroke-dasharray="4 3"/>
  <g class="acc">
    <line x1="220" y1="160" x2="220" y2="250"/><line x1="220" y1="160" x2="290" y2="200"/>
    <line x1="220" y1="160" x2="270" y2="110"/><line x1="220" y1="160" x2="160" y2="95"/>
    <line x1="220" y1="160" x2="140" y2="130"/>
  </g>
  <path class="acc" d="M210 250 l10 6 l0 -10"/><path class="acc" d="M284 205 l6 -8 l-10 -2"/>
  <text class="sub" x="236" y="230">ρ</text>
  <text class="sub" x="292" y="174">τ_max</text>
  <text class="sub" x="196" y="270">实心圆截面</text>

  <text class="fml" x="400" y="104">τ = Tρ / I_p</text>
  <text class="fml" x="400" y="134">τ_max = T / W_p，W_p = I_p / R</text>
  <text class="fml" x="400" y="164">φ = Tl / (GI_p)</text>
  <text class="sub" x="400" y="196">实心圆：I_p=πd⁴/32，W_p=πd³/16</text>
  <text class="sub" x="400" y="220">空心圆：I_p=π(D⁴−d⁴)/32，W_p=π(D⁴−d⁴)/(16D)</text>
  <text class="sub" x="400" y="244">方向：切应力与扭矩转向一致；外表面最大，轴心为零。</text>
</svg>
