<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-label="图乘法示意">
  <style>
    .ink{stroke:#2A2723;fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
    .thin{stroke:#2A2723;fill:none;stroke-width:1}
    .acc{stroke:#8A4B2A;fill:none;stroke-width:1.6}
    .fill{fill:rgba(138,75,42,.10);stroke:#8A4B2A;stroke-width:1.3}
    .dash{stroke:#A8342A;fill:none;stroke-width:1;stroke-dasharray:4 4}
    .lbl{font:12px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#2A2723}
    .sub{font:11px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#6B6357}
    .fml{font:13px "Cambria Math","Times New Roman",serif;fill:#8A4B2A}
    .ttl{font:12px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#17161A;font-weight:600}
  </style>
  <text class="ttl" x="24" y="24">图乘法：把位移积分换成“面积 × 形心纵标”</text>
  <text class="sub" x="24" y="44">条件：EI 分段为常数；M 图与单位力 M̄ 图至少一个是直线。</text>

  <text class="lbl" x="30" y="78">① 三角形 M 图</text>
  <line class="ink" x1="50" y1="150" x2="310" y2="150"/>
  <path class="thin" d="M50 150 l-10 16 h20 z"/>
  <path class="thin" d="M310 150 l-10 16 h20 z"/>
  <path class="fill" d="M50 210 L180 110 L310 210 Z"/>
  <line class="dash" x1="223" y1="210" x2="223" y2="143"/>
  <text class="lbl" x="184" y="102">M</text>
  <text class="sub" x="60" y="232">ω = M l / 2</text>
  <text class="sub" x="228" y="158">形心</text>
  <line class="thin" x1="50" y1="190" x2="50" y2="214"/>
  <line class="thin" x1="310" y1="190" x2="310" y2="214"/>
  <line class="thin" x1="50" y1="204" x2="310" y2="204"/>
  <text class="sub" x="172" y="200">l</text>

  <line x1="360" y1="70" x2="360" y2="270" stroke="#DAD2C3" stroke-width="1"/>

  <text class="lbl" x="386" y="78">② 梯形 M 图</text>
  <line class="ink" x1="390" y1="150" x2="650" y2="150"/>
  <path class="thin" d="M390 150 l-10 16 h20 z"/>
  <path class="thin" d="M650 150 l-10 16 h20 z"/>
  <path class="fill" d="M390 210 L390 158 L650 128 L650 210 Z"/>
  <text class="lbl" x="368" y="156">M₁</text>
  <text class="lbl" x="656" y="124">M₂</text>
  <text class="sub" x="430" y="232">ω = (M₁ + M₂) l / 2</text>

  <text class="fml" x="386" y="284">Δ = Σ (ωᵢ · ȳ_Ci) / EI</text>
  <text class="sub" x="24" y="284">符号：同侧取正，异侧取负；分段、变刚度、温度项要拆开算。</text>
</svg>
