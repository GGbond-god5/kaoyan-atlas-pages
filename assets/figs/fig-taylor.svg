<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-label="泰勒展开">
  <style>
    .ink{stroke:#2A2723;fill:none;stroke-width:1.2}.thin{stroke:#2A2723;fill:none;stroke-width:1}
    .acc{stroke:#17161A;fill:none;stroke-width:2}.t1{stroke:#A8342A;fill:none;stroke-width:1.2;stroke-dasharray:5 3}
    .t3{stroke:#8A4B2A;fill:none;stroke-width:1.3}.t5{stroke:#5B3A6B;fill:none;stroke-width:1.3}
    .lbl{font:12px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#2A2723}
    .sub{font:11px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#6B6357}
    .fml{font:12px "Cambria Math","Times New Roman",serif;fill:#8A4B2A}
  </style>
  <text class="lbl" x="20" y="22">泰勒展开：用多项式逼近，阶数越高、离 0 越近越准</text>
  <text class="sub" x="20" y="40">sin x 的 1/3/5 阶泰勒多项式；带佩亚诺余项时只看 x→0。</text>
  <line class="thin" x1="40" y1="160" x2="430" y2="160"/>
  <line class="thin" x1="235" y1="60" x2="235" y2="260"/>
  <path class="acc" d="M80 230 C130 200 170 100 235 100 C300 100 340 200 390 230"/>
  <path class="t1" d="M100 220 L370 100"/>
  <path class="t3" d="M90 225 C150 180 190 110 235 100 C280 110 320 180 380 225"/>
  <path class="t5" d="M80 232 C140 196 180 98 235 96 C290 98 330 196 390 232"/>
  <text class="sub" x="392" y="94">sin x</text>
  <text class="sub" x="372" y="112" fill="#5B3A6B">T₅</text>
  <text class="sub" x="382" y="206" fill="#8A4B2A">T₃</text>
  <text class="sub" x="356" y="132" fill="#A8342A">T₁</text>
  <text class="fml" x="470" y="100">sin x = x − x³/3! + x⁵/5! − …</text>
  <text class="fml" x="470" y="132">T₁ = x</text>
  <text class="fml" x="470" y="158">T₃ = x − x³/6</text>
  <text class="fml" x="470" y="184">T₅ = x − x³/6 + x⁵/120</text>
  <text class="sub" x="470" y="214">余项：R_n = o(xⁿ)（佩亚诺）或 f⁽ⁿ⁺¹⁾(ξ)xⁿ⁺¹/(n+1)!（拉格朗日）</text>
  <text class="sub" x="470" y="238">考法：求极限、判阶、证明不等式、估误差。</text>
</svg>
