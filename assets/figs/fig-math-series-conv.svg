<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 200" width="560" height="200">
  <rect width="560" height="200" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="20" y="26" font-size="13" font-weight="700" fill="#0f172a">正项级数判别与幂级数收敛域结构图</text>
  <rect x="24" y="46" width="150" height="54" rx="8" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="36" y="68" font-size="12" font-weight="700" fill="#1d4ed8">1. 先判必要条件</text>
  <text x="36" y="86" font-size="11" fill="#334155">lim u_n ≠ 0 ⇒ 必发散</text>
  <line x1="174" y1="73" x2="202" y2="73" stroke="#64748b" stroke-width="1.5"/>
  <rect x="202" y="46" width="160" height="54" rx="8" fill="#ecfdf5" stroke="#10b981"/>
  <text x="214" y="68" font-size="12" font-weight="700" fill="#047857">2. 正项判别法选择</text>
  <text x="214" y="86" font-size="11" fill="#334155">比值(n!)/根值(n次幂)/积分</text>
  <line x1="362" y1="73" x2="390" y2="73" stroke="#64748b" stroke-width="1.5"/>
  <rect x="390" y="46" width="146" height="54" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="402" y="68" font-size="12" font-weight="700" fill="#b45309">3. 交错/一般级数</text>
  <text x="402" y="86" font-size="11" fill="#334155">莱布尼茨 | 绝对/条件收敛</text>
  <line x1="60" y1="155" x2="500" y2="155" stroke="#475569" stroke-width="1.8"/>
  <line x1="150" y1="145" x2="150" y2="165" stroke="#ef4444" stroke-width="2"/>
  <line x1="280" y1="145" x2="280" y2="165" stroke="#1e293b" stroke-width="2"/>
  <line x1="410" y1="145" x2="410" y2="165" stroke="#ef4444" stroke-width="2"/>
  <rect x="150" y="149" width="260" height="12" fill="#bbf7d0" fill-opacity="0.7"/>
  <text x="135" y="182" font-size="11" fill="#dc2626">x₀ - R (单判)</text>
  <text x="273" y="182" font-size="11" font-weight="700" fill="#0f172a">x₀</text>
  <text x="395" y="182" font-size="11" fill="#dc2626">x₀ + R (单判)</text>
  <text x="235" y="136" font-size="11" font-weight="700" fill="#047857">绝对收敛区间 (2R)</text>
</svg>