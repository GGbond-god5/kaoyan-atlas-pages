<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-label="极坐标二重积分">
  <style>
    .ink{stroke:#2A2723;fill:none;stroke-width:1.4}.thin{stroke:#2A2723;fill:none;stroke-width:1}
    .acc{stroke:#8A4B2A;fill:none;stroke-width:1.5}.fill{fill:rgba(138,75,42,.10);stroke:#8A4B2A;stroke-width:1.3}
    .dash{stroke:#A8342A;fill:none;stroke-width:1;stroke-dasharray:4 4}
    .lbl{font:12px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#2A2723}
    .sub{font:11px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#6B6357}
    .fml{font:14px "Cambria Math","Times New Roman",serif;fill:#8A4B2A}
  </style>
  <text class="lbl" x="24" y="24">极坐标：面积微元 dσ = r dr dθ</text>
  <text class="sub" x="24" y="44">先画区域、再定 θ 与 r 的上下限；圆、扇形、环域优先用极坐标。</text>
  <ellipse cx="250" cy="170" rx="130" ry="92" fill="none" stroke="#B9AE9C" stroke-width="1.2"/>
  <line class="thin" x1="250" y1="170" x2="380" y2="170"/><text class="sub" x="384" y="174">θ=0</text>
  <line class="thin" x1="250" y1="170" x2="342" y2="94"/><text class="sub" x="322" y="92">θ=α</text>
  <path class="acc" d="M330 170 A80 80 0 0 0 296 116"/>
  <path class="fill" d="M330 170 L296 116 A80 80 0 0 0 292 122 L326 174 Z"/>
  <text class="sub" x="338" y="150">dθ</text>
  <line class="dash" x1="250" y1="170" x2="326" y2="174"/>
  <text class="sub" x="286" y="184">r</text>
  <text class="sub" x="306" y="164">dr</text>
  <text class="fml" x="430" y="110">∬_D f(x,y) dxdy</text>
  <text class="fml" x="430" y="142">= ∬_D f(r cosθ, r sinθ) · r dr dθ</text>
  <text class="sub" x="430" y="176">区域：θ ∈ [α,β]，r ∈ [r₁(θ), r₂(θ)]</text>
  <text class="sub" x="430" y="200">对称性：关于 x 轴 / y 轴 / 原点先看奇偶</text>
  <text class="sub" x="430" y="224">常见：圆 x²+y²≤R² → r ∈ [0,R]，θ ∈ [0,2π]</text>
</svg>
