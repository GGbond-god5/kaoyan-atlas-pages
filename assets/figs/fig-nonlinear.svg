<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-label="非线性问题示意">
  <style>
    .ink{stroke:#2A2723;fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
    .thin{stroke:#2A2723;fill:none;stroke-width:1}
    .acc{stroke:#8A4B2A;fill:none;stroke-width:1.6}
    .dash{stroke:#A8342A;fill:none;stroke-width:1;stroke-dasharray:4 4}
    .lbl{font:12px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#2A2723}
    .sub{font:11px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#6B6357}
    .ttl{font:12px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#17161A;font-weight:600}
  </style>
  <text class="ttl" x="24" y="24">非线性问题：叠加原理失效，平衡按变形后的位置建立</text>
  <text class="sub" x="24" y="44">807 正卷不常直接考，但理解它能解释“为什么小变形假设如此重要”。</text>

  <!-- panel 1 -->
  <text class="lbl" x="70" y="76">材料非线性（弹塑性）</text>
  <line class="thin" x1="70" y1="250" x2="330" y2="250"/>
  <line class="thin" x1="70" y1="250" x2="70" y2="90"/>
  <path class="acc" d="M70 250 L180 130 L300 130"/>
  <line class="dash" x1="180" y1="130" x2="180" y2="250"/>
  <text class="sub" x="182" y="120">σ_s</text>
  <text class="sub" x="306" y="126">ε</text>
  <text class="sub" x="60" y="84">σ</text>
  <text class="sub" x="120" y="272">弹性段 + 屈服平台</text>

  <!-- panel 2 -->
  <text class="lbl" x="410" y="76">几何/稳定非线性</text>
  <line class="thin" x1="410" y1="250" x2="680" y2="250"/>
  <line class="thin" x1="410" y1="250" x2="410" y2="90"/>
  <path class="acc" d="M410 250 C470 170 530 110 570 108 C610 106 640 150 660 190"/>
  <circle cx="570" cy="108" r="3" fill="#A8342A"/>
  <line class="dash" x1="570" y1="108" x2="570" y2="250"/>
  <text class="sub" x="548" y="100">极限点</text>
  <text class="sub" x="662" y="208">跳跃</text>
  <text class="sub" x="402" y="84">P</text>
  <text class="sub" x="684" y="264">Δ</text>

  <text class="sub" x="70" y="300">判断：材料非线性看 σ-ε 是否偏离直线；几何非线性看变形是否已改变受力路径。</text>
</svg>
