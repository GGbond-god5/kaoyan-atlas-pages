<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" role="img" aria-label="抽样分布">
  <style>
    .ink{stroke:#2A2723;fill:none;stroke-width:1.3}.thin{stroke:#2A2723;fill:none;stroke-width:1}
    .acc{stroke:#8A4B2A;fill:none;stroke-width:1.7}.dash{stroke:#A8342A;fill:none;stroke-width:1;stroke-dasharray:4 4}
    .lbl{font:12px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#2A2723}
    .sub{font:10.5px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#6B6357}
    .fml{font:12px "Cambria Math","Times New Roman",serif;fill:#8A4B2A}
  </style>
  <text class="lbl" x="20" y="22">三大抽样分布：χ²、t、F</text>
  <text class="sub" x="20" y="40">正态总体下，样本均值、样本方差与它们的组合分别服从这三种分布。</text>

  <text class="sub" x="30" y="68">χ²(n)：右偏，n 越大越接近正态</text>
  <line class="thin" x1="30" y1="170" x2="240" y2="170"/>
  <path class="acc" d="M40 170 C60 80 110 62 150 80 C200 104 230 150 240 168"/>
  <text class="sub" x="40" y="188">0</text>
  <text class="fml" x="30" y="212">χ² = Σ Z_i²</text>

  <text class="sub" x="270" y="68">t(n)：对称，厚尾</text>
  <line class="thin" x1="270" y1="170" x2="470" y2="170"/>
  <line class="dash" x1="370" y1="80" x2="370" y2="170"/>
  <path class="acc" d="M280 168 C310 166 330 90 370 88 C410 90 430 166 460 168"/>
  <text class="sub" x="360" y="188">0</text>
  <text class="fml" x="270" y="212">t = Z / √(χ²/n)</text>

  <text class="sub" x="500" y="68">F(m,n)：右偏，两个 χ² 之比</text>
  <line class="thin" x1="500" y1="170" x2="700" y2="170"/>
  <path class="acc" d="M510 170 C520 90 540 78 570 100 C620 134 670 158 700 168"/>
  <text class="sub" x="508" y="188">0</text>
  <text class="fml" x="500" y="212">F = (χ²₁/m)/(χ²₂/n)</text>

  <text class="sub" x="20" y="252">分位数查表：χ²_α(n)、t_α(n)、F_α(m,n)；t 与 F 的尾部方向要看题目。</text>
  <text class="sub" x="20" y="272">正态总体：x̄~N(μ,σ²/n)，(n−1)S²/σ²~χ²(n−1)，且两者独立。</text>
</svg>
