<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" role="img" aria-label="常见分布图形">
  <style>
    .ink{stroke:#2A2723;fill:none;stroke-width:1.2}.thin{stroke:#2A2723;fill:none;stroke-width:1}
    .acc{stroke:#8A4B2A;fill:none;stroke-width:1.7}.bar{fill:rgba(138,75,42,.35);stroke:#8A4B2A;stroke-width:1}
    .lbl{font:12px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#2A2723}
    .sub{font:10.5px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#6B6357}
    .fml{font:11.5px "Cambria Math","Times New Roman",serif;fill:#8A4B2A}
  </style>
  <text class="lbl" x="20" y="22">常见分布的“形状记忆”</text>
  <text class="sub" x="20" y="40">选择题常考：名称—参数—期望方差—图形，四者要能互推。</text>

  <text class="sub" x="30" y="68">二项分布 B(n,p)：离散柱形</text>
  <line class="thin" x1="30" y1="160" x2="230" y2="160"/>
  <rect class="bar" x="50" y="140" width="12" height="20"/><rect class="bar" x="70" y="118" width="12" height="42"/>
  <rect class="bar" x="90" y="96" width="12" height="64"/><rect class="bar" x="110" y="82" width="12" height="78"/>
  <rect class="bar" x="130" y="96" width="12" height="64"/><rect class="bar" x="150" y="120" width="12" height="40"/>
  <rect class="bar" x="170" y="142" width="12" height="18"/>
  <text class="fml" x="30" y="186">E=np, D=np(1−p)</text>

  <text class="sub" x="270" y="68">泊松分布 P(λ)：离散、右偏</text>
  <line class="thin" x1="270" y1="160" x2="450" y2="160"/>
  <rect class="bar" x="290" y="120" width="12" height="40"/><rect class="bar" x="310" y="96" width="12" height="64"/>
  <rect class="bar" x="330" y="90" width="12" height="70"/><rect class="bar" x="350" y="104" width="12" height="56"/>
  <rect class="bar" x="370" y="126" width="12" height="34"/><rect class="bar" x="390" y="142" width="12" height="18"/>
  <text class="fml" x="270" y="186">E=D=λ</text>

  <text class="sub" x="490" y="68">指数分布 E(λ)：连续、单调降</text>
  <line class="thin" x1="490" y1="160" x2="700" y2="160"/>
  <path class="acc" d="M500 76 C540 110 580 142 700 158"/>
  <text class="fml" x="490" y="186">E=1/λ, D=1/λ²</text>

  <text class="sub" x="20" y="228">均匀 U(a,b)：矩形；正态 N(μ,σ²)：钟形；χ²/t/F 见抽样分布页。</text>
  <text class="sub" x="20" y="250">无记忆性：P(X&gt;s+t|X&gt;s)=P(X&gt;t)，只有指数分布（离散为几何分布）具有。</text>
</svg>
