<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-label="欧拉公式推导">
  <style>
    .ink{stroke:#2A2723;fill:none;stroke-width:1.3}.thin{stroke:#2A2723;fill:none;stroke-width:1}
    .acc{stroke:#8A4B2A;fill:none;stroke-width:1.6}.dash{stroke:#A8342A;fill:none;stroke-width:1;stroke-dasharray:4 3}
    .lbl{font:12px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#2A2723}
    .sub{font:11px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#6B6357}
    .fml{font:13px "Cambria Math","Times New Roman",serif;fill:#8A4B2A}
  </style>
  <text class="lbl" x="24" y="24">欧拉公式推导：从微弯平衡到 P_cr</text>
  <text class="sub" x="24" y="44">假设线弹性、小变形、两端铰支；失稳时轴线有微小挠度 v(x)。</text>

  <line class="ink" x1="150" y1="90" x2="150" y2="250"/>
  <line class="ink" x1="450" y1="90" x2="450" y2="250"/>
  <path class="acc" d="M150 90 C230 90 230 250 450 250" transform="translate(0,0)"/>
  <path class="acc" d="M150 90 C250 70 350 270 450 250"/>
  <line class="dash" x1="150" y1="90" x2="150" y2="50"/><path class="dash" d="M143 58 l7 -9 l7 9"/>
  <line class="dash" x1="450" y1="90" x2="450" y2="50"/><path class="dash" d="M443 58 l7 -9 l7 9"/>
  <text class="sub" x="100" y="66">P</text><text class="sub" x="452" y="66">P</text>
  <text class="sub" x="270" y="286">l</text>
  <line class="thin" x1="150" y1="270" x2="450" y2="270"/>

  <text class="fml" x="520" y="96">M(x) = −P v(x)</text>
  <text class="fml" x="520" y="124">EI v″ = M = −P v</text>
  <text class="fml" x="520" y="152">v″ + k² v = 0，k² = P/EI</text>
  <text class="fml" x="520" y="180">v = A sin kx + B cos kx</text>
  <text class="sub" x="520" y="208">边界：v(0)=0 → B=0；v(l)=0 → sin kl=0</text>
  <text class="fml" x="520" y="236">kl = nπ → P_cr = π²EI / l²</text>
  <text class="sub" x="520" y="262">其他支承：P_cr = π²EI / (μl)²</text>
  <text class="sub" x="520" y="284">两端铰支 μ=1；一端固定一端自由 μ=2；两端固定 μ=0.5；一端固定一端铰支 μ≈0.7。</text>
</svg>
